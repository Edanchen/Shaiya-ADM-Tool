name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Neuer Release-Tag, zum Beispiel v1.11"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: MSBuild einrichten
        uses: microsoft/setup-msbuild@v2

      - name: Release bauen
        run: >-
          msbuild ADM-Tool.sln
          /m
          /t:Rebuild
          /p:Configuration=Release
          /p:Platform=x86
          /p:GenerateManifests=false

      - name: Release paketieren
        id: package
        shell: pwsh
        env:
          MANUAL_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $version = $env:GITHUB_REF_NAME
          } else {
            $version = $env:MANUAL_RELEASE_TAG
          }

          if ($version -notmatch '^v[0-9]+(?:\.[0-9]+){1,2}$') {
            throw "Der Release-Tag muss dem Format v1.11 oder v1.11.0 entsprechen."
          }

          $package = "release/Shaiya-ADM-Tool-$version"
          $archive = "$package.zip"
          New-Item -ItemType Directory -Path "$package/SQL" -Force | Out-Null
          Copy-Item "ADM-Tool/bin/Release/*" $package -Recurse
          Copy-Item "SQL/*" "$package/SQL" -Recurse
          Copy-Item README.md, LICENSE $package
          Compress-Archive -Path "$package/*" -DestinationPath $archive

          $checksum = "$archive.sha256"
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $archive -Leaf)" | Set-Content $checksum -NoNewline

          "archive=$archive" >> $env:GITHUB_OUTPUT
          "checksum=$checksum" >> $env:GITHUB_OUTPUT
          "release_tag=$version" >> $env:GITHUB_OUTPUT

      - name: Build-Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Shaiya-ADM-Tool-${{ steps.package.outputs.release_tag }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.checksum }}
          if-no-files-found: error

      - name: GitHub Release erstellen
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.package.outputs.release_tag }}"
          $arguments = @(
            "release", "create", $tag,
            "${{ steps.package.outputs.archive }}",
            "${{ steps.package.outputs.checksum }}",
            "--generate-notes",
            "--title", "Shaiya ADM Tool $tag"
          )

          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $arguments += "--verify-tag"
          } else {
            $arguments += @("--target", $env:GITHUB_SHA)
          }

          & gh @arguments
          if ($LASTEXITCODE -ne 0) { throw "Das GitHub Release konnte nicht erstellt werden." }
